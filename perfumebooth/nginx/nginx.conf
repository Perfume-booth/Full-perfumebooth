# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy — PerfumeBooth
#
# Routing rules:
#   /api/*      → Django backend  (port 8000)
#   /static/*   → Django static files (shared volume)
#   /media/*    → Django media files  (shared volume)
#   /health     → Nginx health probe
#   /*          → Next.js frontend   (port 3000)
# ─────────────────────────────────────────────────────────────────────────────

upstream django_backend {
    server django:8000 fail_timeout=0;
    keepalive 32;
}

upstream nextjs_frontend {
    server nextjs:3000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Client Settings ───────────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Block Malicious Scanners ──────────────────────────────────────────────
    if ($http_user_agent ~* (acunetix|sqlmap|nikto|nmap|masscan)) {
        return 403;
    }

    # ── Health Check (used by Docker healthcheck) ─────────────────────────────
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Django Static Files ───────────────────────────────────────────────────
    location /static/ {
        alias /var/www/perfumebooth/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # ── Django Media Files ────────────────────────────────────────────────────
    location /media/ {
        alias /var/www/perfumebooth/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Django Admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Django REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming/SSE endpoints
        proxy_buffering        off;
        proxy_redirect         off;
        proxy_connect_timeout  60s;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;

        # Enable HTTP keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Next.js Frontend (catch-all) ──────────────────────────────────────────
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Next.js HMR WebSocket in dev (no-op in prod)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_redirect     off;
        proxy_read_timeout 60s;
    }
}
