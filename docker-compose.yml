version: '3.8'

services:
  # 1. PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: perfumebooth_db
    restart: always
    environment:
      POSTGRES_DB: perfumebooth
      POSTGRES_USER: perfumebooth_user
      POSTGRES_PASSWORD: perfumebooth_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumebooth_user -d perfumebooth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Celery Message Broker
  redis:
    image: redis:7-alpine
    container_name: perfumebooth_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Django REST API Backend
  django:
    build:
      context: ./perfumebooth-backend
      dockerfile: Dockerfile
    container_name: perfumebooth_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_admin &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DEBUG: "False"
      SECRET_KEY: "prod-perfumebooth-secret-key-change-in-env"
      DATABASE_URL: "postgres://perfumebooth_user:perfumebooth_password@db:5432/perfumebooth"
      REDIS_URL: "redis://redis:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,django,storefront,mps"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Worker for Background Async Tasks
  celery_worker:
    build:
      context: ./perfumebooth-backend
      dockerfile: Dockerfile
    container_name: perfumebooth_celery
    restart: always
    command: celery -A core worker --loglevel=info
    environment:
      DATABASE_URL: "postgres://perfumebooth_user:perfumebooth_password@db:5432/perfumebooth"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - django
      - redis

  # 5. Customer Storefront Next.js App
  storefront:
    build:
      context: ./perfumebooth
      dockerfile: Dockerfile
    container_name: perfumebooth_storefront
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - django

  # 6. Merchant Portal (MPS) Next.js Dashboard
  mps:
    build:
      context: ./perfumebooth-MPS
      dockerfile: Dockerfile
    container_name: perfumebooth_mps
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - django

volumes:
  postgres_data:
